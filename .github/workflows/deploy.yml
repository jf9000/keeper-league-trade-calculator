name: Test and refresh data

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly refresh (Tuesdays, 09:17 UTC), after Monday Night Football so the full week's stats are in.
    - cron: '17 9 * * 2'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets the weekly refresh commit the new players.json
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Scheduled and manual runs pull fresh ADP data. If a source is down, or the data fails
      # validation, the script leaves the committed players.json alone and the deploy carries on.
      - name: Refresh ADP data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run build-players

      - run: npm test
      - run: npm run build

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! git diff --quiet -- public/players.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/players.json
            git commit -m "Refresh ADP data"
            git push
          fi
